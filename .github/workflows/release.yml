name: Release TSV

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge TSV files
        run: |
          DATE=$(date +'%Y-%m-%d')
          OUTPUT="all_${DATE}.tsv"

          find tsv -maxdepth 1 -type f -name "*.tsv" -print0 \
            | xargs -0 cat > "$OUTPUT"

          echo "OUTPUT=$OUTPUT" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT }}
          generate_release_notes: true