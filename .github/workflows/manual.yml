name: Release TSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge TSV files
        run: |
          DATE=$(date +'%Y-%m-%d')
          OUTPUT="all_${DATE}.tsv"
      
          find tsv -maxdepth 1 -type f -name "*.tsv" -print0 \
            | xargs -0 cat > "$OUTPUT"
      
          # ファイル末尾が改行でなければ追加
            if [ "$(tail -c 1 "$file" | wc -l)" -eq 0 ]; then
              printf '\n' >> "$OUTPUT"
            fi
          done
      
          echo "OUTPUT=$OUTPUT" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "data-${{ github.run_number }}"
          name: "Dictionary ${{ env.OUTPUT }}"
          files: ${{ env.OUTPUT }}
          generate_release_notes: true
