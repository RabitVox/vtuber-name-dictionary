<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VTuber Name Dictionary</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="container">
        <h1>VTuber Name Dictionary</h1>
        <p>VTuberの名前を検索できる辞書</p>
    </div>
</header>

<main class="container">

    <section class="search-section">

        <label for="search">
            名前を検索
        </label>

        <input
            id="search"
            type="search"
            placeholder="名前・読みを入力..."
            autocomplete="off"
        >

    </section>

    <section class="info">
        <span id="result-count">0件</span>
    </section>

    <section>
        <table>
            <thead>
                <tr>
                    <th>名前</th>
                    <th>読み</th>
                    <th>カテゴリ</th>
                </tr>
            </thead>

            <tbody id="results"></tbody>
        </table>
    </section>

</main>

<footer class="footer">
    <div class="container">
        <a
            href="https://github.com/RabitVox/vtuber-name-dictionary"
            target="_blank"
            rel="noopener"
        >
            GitHub
        </a>
    </div>
</footer>

<script src="js/app.js"></script>

</body>
</html>
