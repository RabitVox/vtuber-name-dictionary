<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VTuber Name Dictionary</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div class="site-heading">
            <a
                class="site-title"
                href="./"
            >
                VTuber Name Dictionary
            </a>

            <p class="site-description">
                VTuberの名前を検索できる辞書
            </p>
        </div>

        <a
            class="github-link"
            href="https://github.com/RabitVox/vtuber-name-dictionary"
            target="_blank"
            rel="noopener noreferrer"
        >
            <svg
                class="github-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M12 2C6.48 2 2 6.58 2 12.25c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49
                    0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.38-3.37-1.38-.45-1.19-1.11-1.5-1.11-1.5
                    -.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.9 1.58 2.36 1.12 2.94.86
                    .09-.67.35-1.12.64-1.38-2.22-.26-4.55-1.14-4.55-5.07 0-1.12.39-2.03 1.03-2.75
                    -.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.14 9.14 0 0 1 12 6.15c.85 0
                    1.71.12 2.51.36 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72
                    1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01
                    2.47-.01 2.8 0 .27.18.6.69.49A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"
                />
            </svg>

            <span>vtuber-name-dictionary</span>
        </a>

    </div>
</header>

<main class="container">

    <section class="search-section">

        <label for="search">
            名前を検索
        </label>

        <input
            id="search"
            type="search"
            placeholder="名前・読みを入力..."
            autocomplete="off"
        >

    </section>

    <section class="info">
      <span id="result-count"></span>
    </section>

    <section>
        <table>
            <thead>
                <tr>
                    <th>読み</th>
                    <th>名前</th>
                </tr>
            </thead>

            <tbody id="results"></tbody>
        </table>
    </section>

</main>

</html>
